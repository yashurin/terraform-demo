name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/terraform-dev.yml"
      - ".github/workflows/terraform-dev-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Apply ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    concurrency:
      group: lumen-factory-apply-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Refuse automatic prod apply
        if: env.TARGET_ENV == 'prod' && github.event_name != 'workflow_dispatch'
        run: |
          echo "Prod apply is workflow_dispatch only."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m app.build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: lumen-factory-apply-${{ github.run_id }}

      - name: Write backend config
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          env = os.environ["TARGET_ENV"]
          if env not in {"dev", "prod"}:
              raise SystemExit(f"unexpected environment {env}")
          body = (
              f'bucket         = "{os.environ["TF_STATE_BUCKET"]}"\n'
              f'region         = "{os.environ["AWS_REGION"]}"\n'
              f'dynamodb_table = "{os.environ["TF_LOCK_TABLE"]}"\n'
          )
          Path("infra/envs", env, "backend.hcl").write_text(body)
          PY

      - name: Init, validate, apply
        working-directory: infra/envs/${{ env.TARGET_ENV }}
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform validate
          terraform apply -input=false -auto-approve
          terraform output cloudfront_url
